name: Release PULSO Server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0; defaults to ref name)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Container Hardening & Runtime Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pulso:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root USER 65532 and hardened container execution
        run: |
          set -euo pipefail
          IMAGE_USER="$(docker inspect --format '{{.Config.User}}' pulso:smoke)"
          echo "Image Config.User=${IMAGE_USER}"
          case "${IMAGE_USER}" in
            65532|65532:65532) ;;
            *)
              echo "Expected USER 65532(:65532), got '${IMAGE_USER}'" >&2
              exit 1
              ;;
          esac

          docker run -d \
            --name pulso-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -e TRUST_PROXY=false \
            -p 127.0.0.1:3001:3001 \
            pulso:smoke

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          HEALTHZ="$(curl -fsS http://127.0.0.1:3001/healthz)"
          echo "GET /healthz -> ${HEALTHZ}"
          echo "${HEALTHZ}" | grep -q '"ok":true'

          RUNTIME="$(curl -fsS http://127.0.0.1:3001/api/runtime)"
          echo "GET /api/runtime -> ${RUNTIME}"
          echo "${RUNTIME}" | grep -q '"runtimeMode":"normal"'

          INSPECT_STATE="$(docker inspect --format '{{.State.Running}} uid={{.Config.User}}' pulso:smoke)"
          echo "Container state: ${INSPECT_STATE}"

      - name: Clean up smoke-test container
        if: always()
        run: docker rm -f pulso-smoke || true

  publish:
    name: Build & Publish Multi-Arch Server Image
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag and lowercase owner
        id: prep
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -z "${TAG}" ] || [[ "${TAG}" != v* ]]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          OWNER_LOWER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "owner_lower=${OWNER_LOWER}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GHCR Docker metadata
        id: meta_ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner_lower }}/pulso
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.prep.outputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.prep.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.prep.outputs.tag, '-') }}

      - name: Build and push multi-arch image to GHCR
        id: push_ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.prep.outputs.owner_lower }}/pulso
          subject-digest: ${{ steps.push_ghcr.outputs.digest }}
          push-to-registry: true

      - name: Check optional Docker Hub mirror credentials
        id: dockerhub_check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to Docker Hub (optional mirror)
        if: steps.dockerhub_check.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}

      - name: Generate Docker Hub metadata (optional mirror)
        id: meta_dockerhub
        if: steps.dockerhub_check.outputs.enabled == 'true'
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}/pulso
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.prep.outputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.prep.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.prep.outputs.tag, '-') }}

      - name: Mirror multi-arch image to Docker Hub (optional)
        if: steps.dockerhub_check.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          cache-from: type=gha
