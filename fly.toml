# =============================================================================
# PULSO Servidor — Configuração Fly.io (`fly.toml`)
# =============================================================================
# IMPORTANTE PARA O OPERADOR:
# 1. `auto_stop_machines = false` é obrigatório porque o PULSO mantém todas as
#    Salas e chaves efêmeras exclusivamente em RAM; suspender/parar a Machine
#    derruba Salas ativas e descarta Mensagens Efêmeras em curso.
# 2. Fly `[http_service]` roteia apenas HTTP/HTTPS/WebSocket (TCP). Para
#    Chamada de Vídeo atrás de NAT simétrico, configure um TURN externo via:
#      - Self-hosted (`coturn` em VPS com `deploy/docker-compose.yml`):
#          fly secrets set TURN_URLS="turn:turn.seudominio.com:3478?transport=udp,turn:turn.seudominio.com:3478?transport=tcp" TURN_SECRET="<segredo>"
#      - Gerenciado (ex.: Cloudflare Realtime TURN):
#          fly secrets set TURN_URLS="turn:turn.cloudflare.com:3478?transport=udp,turns:turn.cloudflare.com:5349?transport=tcp" TURN_USERNAME="<id>" TURN_CREDENTIAL="<token>"
#        (Nota: o servidor TURN externo observa IPs de mídia; DTLS/SRTP permanece E2EE.)
# =============================================================================

app = "pulso-server"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3001"
  TRUST_PROXY = "true"
  STUN_URLS = "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
  TURN_TTL_SECONDS = "3600"
  PULSO_INACTIVITY_MS = "3600000"
  PULSO_GRACE_WINDOW_MS = "30000"
  PULSO_MAX_ROOMS = "1000"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
